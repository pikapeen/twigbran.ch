<!DOCTYPE html>

<html>
    <head>
        <title>twigbran.ch</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <style>

        body {
            margin: 0;
        }
        .fc {
            display: flex;
            position: relative;
            background-color: #b7b094;  
            width: 100%;
            height: 100vh;
            align-items: center;
            align-content: center;
            justify-content: center;
        }
    
        .card {
            display: flex;
            background-color: wheat;
            width: 80vw;
            height: 80vh;
            border-radius: 25px;
            align-items: center;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.38), 0 6px 20px 0 rgba(0, 0, 0, 0.4);
        }

        #pfp {
            width: 50vw;
            height: auto;
            border-radius: 20px;
            object-fit: cover;
        }

        H1 {
            font-size: 30px;
            font-family: sans-serif;
        }

        #SB {
            display: flex;
            justify-content: center;
            align-items: center;
            align-content: center;  
        }

        a {
            padding: 10%
        }

        img {
            width: 10vw;
        }

        .as {
            display: flex;
            align-content: center;
            justify-content: center;
            width: 10vw;
        }
        #BTNS {
            height: 30vh;
            width: 80%;
            display: flex;
            justify-content: center;
            flex-direction: column;
        }

        button {
            margin: 5%; 
            font-size: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.38), 0 6px 20px 0 rgba(0, 0, 0, 0.4);
            border: 3px solid white;
            background-color: rgb(92, 77, 35);
            transition-duration: 0.4s;
            color: white;
            padding: 1%;
        }

        button:hover {
            background-color: rgb(175, 157, 106);
            color: white;
        }

        @media screen and (min-width: 600px) {
            .card {
                width: 30vw;
            }

            #pfp {
                width: 10vw;
            }
            .as {
                width: 100%;
            }

            img {
                width: 3vw;
            }

            button {
                font-size: 15px;
            }
            
        }

    </style>

    <body>
        <div class="fc">
            <div class="card">
                <img src="pfp.png" id="pfp">

                <h1>Twigbranch</h1>
                <div id="SB">
                    <a class="as" href="https://artfight.net/~twigbranch45">
                        <img src="artfight.svg">
                    </a>

                    <a class="as" href="https://www.youtube.com/@Twigbranch-4556">
                        <img src="youtube.svg">
                    </a>
                 
                    <a class="as" href="https://instagram.com">
                        <img src="instagram.svg">
                    </a>

                    <a class="as" href="https://discord.gg/Jc9sX3PQCT">
                        <img src="discord.svg">
                    </a>
                </div>
                <div id="BTNS">
                    <button onclick="window.location.href='/PF'">Twig's Portfolio!</button>
                    <button onclick="window.location.href='https://docs.google.com/document/d/16NyjidA9dIS7WjYX2K2BslOSp0ScFaTSvWRVxZmjhVQ/view'">Twig's Commission Page & TOS!</button>
                </div>
            </div>
        </div>
        
    </body>
</html>
